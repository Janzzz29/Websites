<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aking Live Website!</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .card {
            background-color: #161b22;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Gumagana na ang Website ko!</h1>
        <p>Naka-host ito 24/7 sa GitHub Pages.</p>
        <button onclick="pindot()">Subukan ang JS</button>
        <h2 id="resulta"></h2>
    </div>

    <script>
        function pindot() {
            document.getElementById('resulta').innerText = "⚡ Hello mula sa JavaScript!";
        }
    </script>
</body>
</html>
