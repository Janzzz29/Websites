<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steal a Legendary Egg - Official Roblox Game</title>
    <style>
        * { box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background-color: #1e293b;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 2px solid #3b82f6;
            text-align: center;
        }
        .game-title {
            font-size: 26px;
            color: #facc15;
            text-shadow: 0 4px 10px rgba(250,204,21,0.3);
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
            margin-bottom: 20px;
        }
        .play-btn {
            display: block;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            text-decoration: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 20px;
            margin-bottom: 25px;
            box-shadow: 0 6px 0 #15803d;
            transition: 0.1s;
        }
        .play-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .section-title {
            font-size: 16px;
            color: #38bdf8;
            margin-top: 20px;
            text-align: left;
            border-bottom: 2px solid #334155;
            padding-bottom: 5px;
        }
        .code-box {
            background-color: #0f172a;
            border: 1px dashed #38bdf8;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .code-text { color: #facc15; font-size: 16px; }
        .reward { font-size: 12px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">OFFICIAL GAME SITE</div>
        <div class="game-title">🥚 Steal a Legendary Egg</div>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">
            Steal eggs from other players, hatch Legendary Pets, and become the top player!
        </p>

        <!-- PALITAN ANG LINK SA IBABA NG LINK NG ROBLOX GAME MO -->
        <a href="https://www.roblox.com" class="play-btn">▶ PLAY ON ROBLOX</a>

        <div class="section-title">🎁 ACTIVE GAME CODES</div>
        
        <div class="code-box">
            <div>
                <div class="code-text">LEGENDARY2026</div>
                <div class="reward">Reward: Free Legendary Egg</div>
            </div>
            <span style="color:#22c55e; font-size:12px;">ACTIVE</span>
        </div>

        <div class="code-box">
            <div>
                <div class="code-text">FREECOINS</div>
                <div class="reward">Reward: 500 Coins</div>
            </div>
            <span style="color:#22c55e; font-size:12px;">ACTIVE</span>
        </div>

    </div>

</body>
</html>
